apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: openapi-service-template
  title: OpenAPI Service
  description: Create a new OpenAPI specification and register it in the Backstage catalog
  tags:
    - openapi
    - api
spec:
  owner: user:guest
  type: api

  parameters:
    - title: API Details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: API Name
          type: string
          description: Unique name for your API (e.g. payments-api)
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description of what the API does
        owner:
          title: Owner
          type: string
          description: Team or user that owns this API
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
