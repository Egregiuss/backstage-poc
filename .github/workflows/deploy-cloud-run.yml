name: Deploy Backstage to Cloud Run

on:
  push:
    branches:
      - main
      - upgrade/*
      - feature/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    uses: Egregiuss/central_pipelines/.github/workflows/node-ci.yml@main
    with:
      node-version: '24'

  security-scan:
    needs: ci
    uses: Egregiuss/central_pipelines/.github/workflows/security-scan.yml@main
    with:
      language: node
      node-version: '24'

  deploy:
    needs: [ci, security-scan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: Egregiuss/central_pipelines/.github/workflows/node-deploy-cloud-run.yml@main
    with:
      node-version: '24'
      gar-repository: backstage
      image-name: backstage
      dockerfile: packages/backend/Dockerfile
      cloud-run-port: 7007
      cloud-sql-instances: project-backstage:europe-west2:backstage-postgres
      cloud-run-env-vars: NODE_ENV=production
    secrets:
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      POSTGRES_PASSWORD_SECRET_NAME: ${{ secrets.POSTGRES_PASSWORD_SECRET_NAME }}
      BACKSTAGE_BASE_URL: ${{ secrets.BACKSTAGE_BASE_URL }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
