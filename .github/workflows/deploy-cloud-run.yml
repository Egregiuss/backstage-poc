name: Deploy Backstage to Cloud Run

on:
  push:
    branches:
      - main
      - upgrade/*
      - feature/*
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  ci:
    uses: Egregiuss/central_pipelines/.github/workflows/node-ci.yml@main
    with:
      node-version: '24'

  security-scan:
    needs: ci
    uses: Egregiuss/central_pipelines/.github/workflows/security-scan.yml@main
    with:
      language: node
      node-version: '24'

  # -------------------------
  # PRODUCTION DEPLOYMENT
  # -------------------------
  deploy:
    needs: [ci, security-scan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: Egregiuss/central_pipelines/.github/workflows/node-deploy-gke.yml@main
    with:
      node-version: '24'
      gar-repository: backstage
      image-name: backstage
      dockerfile: packages/backend/Dockerfile
      gke-cluster: backstage-cluster
      gke-zone: europe-west2
      k8s-namespace: backstage
      k8s-manifests-dir: k8s
    secrets:
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
