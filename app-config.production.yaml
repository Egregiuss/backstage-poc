app:
  baseUrl: https://34-160-54-180.sslip.io

backend:
  baseUrl: https://34-160-54-180.sslip.io
  listen:
    port: 7007
    host: 0.0.0.0
  csp:
    upgrade-insecure-requests: false
  helmet:
    strictTransportSecurity: false
    contentSecurityPolicy:
      directives:
        upgrade-insecure-requests: false
  cors:
    origin: https://34-160-54-180.sslip.io
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

catalog:
  locations:
    - type: file
      target: ./examples/entities.yaml

    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
