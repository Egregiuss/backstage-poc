apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: backstage
  annotations:
    kubernetes.io/ingress.global-static-ip-name: backstage-static-ip
    networking.gke.io/managed-certificates: backstage-cert
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - host: 8-232-102-229.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: backstage-cert
  namespace: backstage
spec:
  domains:
    - 8-232-102-229.sslip.io
